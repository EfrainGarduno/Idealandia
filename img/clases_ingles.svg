<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c40f7"/>
      <stop offset="100%" stop-color="#4f24d6"/>
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="avatarGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="avatarGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4a154b" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Shape -->
  <rect x="20" y="20" width="560" height="410" rx="32" fill="url(#bgGlow)"/>

  <!-- World Network / Globe Grid -->
  <g opacity="0.35" transform="translate(300, 225)">
    <circle r="150" fill="none" stroke="#6c40f7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <ellipse rx="150" ry="70" fill="none" stroke="#6c40f7" stroke-width="1.5"/>
    <ellipse rx="70" ry="150" fill="none" stroke="#6c40f7" stroke-width="1.5"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#6c40f7" stroke-width="1.5"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#6c40f7" stroke-width="1.5"/>
    <!-- Connection Dots -->
    <circle cx="-95" cy="-45" r="4.5" fill="#6c40f7"/>
    <circle cx="90" cy="-60" r="4.5" fill="#06b6d4"/>
    <circle cx="110" cy="50" r="4.5" fill="#f97316"/>
    <circle cx="-80" cy="65" r="4.5" fill="#8b5cf6"/>
    <circle cx="0" cy="-70" r="4" fill="#6c40f7"/>
  </g>

  <!-- Arcs connecting people -->
  <path d="M 160 210 Q 300 110 440 210" fill="none" stroke="#6c40f7" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M 190 260 Q 300 340 410 260" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Central Badge / Language Bridge -->
  <g transform="translate(300, 135)" filter="url(#shadowLight)">
    <rect x="-65" y="-22" width="130" height="44" rx="22" fill="#ffffff"/>
    <circle cx="-38" cy="0" r="14" fill="#f3e8ff"/>
    <text x="-38" y="5" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#6c40f7" text-anchor="middle">EN</text>
    <path d="M -14 -2 L -6 0 L -14 2 Z" fill="#6c40f7"/>
    <path d="M -6 0 L 6 0" stroke="#6c40f7" stroke-width="2"/>
    <path d="M 14 -2 L 6 0 L 14 2 Z" fill="#06b6d4"/>
    <circle cx="38" cy="0" r="14" fill="#e0f2fe"/>
    <text x="38" y="5" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0284c7" text-anchor="middle">ES</text>
  </g>

  <!-- LEFT CHARACTER (Learner 1: Conversing with confidence) -->
  <g transform="translate(150, 240)">
    <!-- Base Platform -->
    <ellipse cx="0" cy="115" rx="75" ry="16" fill="#c4b5fd" opacity="0.4"/>
    <!-- Body -->
    <path d="M -45 105 C -45 60 -30 45 0 45 C 30 45 45 60 45 105 Z" fill="url(#primaryGrad)"/>
    <!-- Scarf/Collar -->
    <path d="M -16 48 Q 0 58 16 48 Q 12 70 0 72 Q -12 70 -16 48 Z" fill="#ede9fe"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="30" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M -32 5 C -30 -25 25 -32 32 -5 C 22 -18 -15 -18 -26 0 Z" fill="#4a2810"/>
    <path d="M -32 5 Q -38 25 -25 35 Q -30 15 -28 5 Z" fill="#4a2810"/>
    <!-- Face details -->
    <circle cx="-8" cy="10" r="2.5" fill="#334155"/>
    <circle cx="8" cy="10" r="2.5" fill="#334155"/>
    <path d="M -4 20 Q 0 25 4 20" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-14" cy="18" r="4" fill="#fca5a5" opacity="0.6"/>
    <circle cx="14" cy="18" r="4" fill="#fca5a5" opacity="0.6"/>
    <!-- Left Hand gesturing -->
    <circle cx="36" cy="75" r="9" fill="#fed7aa"/>
    <!-- Tablet / Notebook -->
    <rect x="-35" y="70" width="35" height="42" rx="5" fill="#ffffff" transform="rotate(-15 -20 85)" filter="url(#shadowLight)"/>
    <line x1="-30" y1="80" x2="-10" y2="75" stroke="#cbd5e1" stroke-width="2" transform="rotate(-15 -20 85)"/>
    <line x1="-30" y1="90" x2="-12" y2="85" stroke="#6c40f7" stroke-width="2" transform="rotate(-15 -20 85)"/>
  </g>

  <!-- Speech Bubble from Left Person -->
  <g transform="translate(100, 115)" filter="url(#shadowLight)">
    <rect x="-10" y="-30" width="165" height="52" rx="16" fill="url(#cardGrad)"/>
    <!-- Tail -->
    <polygon points="40,22 55,22 45,34" fill="#ffffff"/>
    <circle cx="15" cy="-4" r="14" fill="#ede9fe"/>
    <text x="15" y="1" font-family="'Font Awesome 6 Free', sans-serif" font-weight="900" font-size="12" fill="#6c40f7" text-anchor="middle">💬</text>
    <text x="36" y="-10" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#1e293b">"Hello world!"</text>
    <text x="36" y="7" font-family="'Poppins', sans-serif" font-weight="500" font-size="10" fill="#64748b">Hablemos con fluidez</text>
  </g>

  <!-- RIGHT CHARACTER (Learner 2: Listening & Practicing) -->
  <g transform="translate(450, 240)">
    <!-- Base Platform -->
    <ellipse cx="0" cy="115" rx="75" ry="16" fill="#bae6fd" opacity="0.4"/>
    <!-- Body -->
    <path d="M -45 105 C -45 60 -30 45 0 45 C 30 45 45 60 45 105 Z" fill="url(#accentTeal)"/>
    <!-- Shirt Collar -->
    <polygon points="-12,45 0,60 12,45" fill="#ffffff"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="30" fill="#fcd34d"/>
    <!-- Hair Modern Cut -->
    <path d="M -30 2 C -30 -28 26 -28 30 -2 C 16 -12 -8 -15 -28 2 Z" fill="#1e293b"/>
    <!-- Headphones -->
    <path d="M -31 10 A 32 32 0 0 1 31 10" fill="none" stroke="#6c40f7" stroke-width="5" stroke-linecap="round"/>
    <rect x="-35" y="2" width="8" height="18" rx="4" fill="#6c40f7"/>
    <rect x="27" y="2" width="8" height="18" rx="4" fill="#6c40f7"/>
    <!-- Face details -->
    <circle cx="-8" cy="12" r="2.5" fill="#1e293b"/>
    <circle cx="8" cy="12" r="2.5" fill="#1e293b"/>
    <path d="M -5 22 Q 0 27 5 22" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Coffee Mug / Interaction item -->
    <rect x="-32" y="75" width="22" height="26" rx="4" fill="#ffffff" filter="url(#shadowLight)"/>
    <path d="M -32 80 C -40 80 -40 92 -32 92" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-21" cy="88" r="4" fill="#0284c7"/>
    <!-- Hand holding mug -->
    <circle cx="-16" cy="86" r="7" fill="#fcd34d"/>
  </g>

  <!-- Speech Bubble from Right Person -->
  <g transform="translate(390, 115)" filter="url(#shadowLight)">
    <rect x="-5" y="-30" width="160" height="52" rx="16" fill="url(#cardGrad)"/>
    <!-- Tail -->
    <polygon points="60,22 75,22 65,34" fill="#ffffff"/>
    <circle cx="18" cy="-4" r="14" fill="#e0f2fe"/>
    <text x="18" y="1" font-family="'Font Awesome 6 Free', sans-serif" font-weight="900" font-size="12" fill="#0284c7" text-anchor="middle">✨</text>
    <text x="38" y="-10" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#1e293b">"Great idea!"</text>
    <text x="38" y="7" font-family="'Poppins', sans-serif" font-weight="500" font-size="10" fill="#64748b">A tu propio ritmo</text>
  </g>

  <!-- Sparkles & Idealandia Decorative Elements -->
  <!-- Sparkle 1 -->
  <g transform="translate(300, 50)" fill="#6c40f7">
    <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z"/>
  </g>
  <!-- Sparkle 2 -->
  <g transform="translate(480, 55)" fill="#f59e0b">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z"/>
  </g>
  <!-- Sparkle 3 -->
  <g transform="translate(120, 60)" fill="#06b6d4">
    <path d="M 0 -9 L 2.5 -2.5 L 9 0 L 2.5 2.5 L 0 9 L -2.5 2.5 L -9 0 L -2.5 -2.5 Z"/>
  </g>

  <!-- Floating Audio Soundwave Pill (Foros en Vivo badge) -->
  <g transform="translate(300, 325)" filter="url(#shadowLight)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#ffffff"/>
    <circle cx="-62" cy="0" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-48" y="4" font-family="'Poppins', sans-serif" font-weight="700" font-size="11" fill="#1e293b">Foros en vivo</text>
    <!-- Wave bars -->
    <rect x="42" y="-7" width="3" height="14" rx="1.5" fill="#6c40f7"/>
    <rect x="48" y="-11" width="3" height="22" rx="1.5" fill="#6c40f7"/>
    <rect x="54" y="-5" width="3" height="10" rx="1.5" fill="#6c40f7"/>
    <rect x="60" y="-9" width="3" height="18" rx="1.5" fill="#6c40f7"/>
  </g>
</svg>
