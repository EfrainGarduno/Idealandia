<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Nagualito</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        #chat-container {
            width: 400px;
            height: 500px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #chat-history {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
        }

        .nagualito-message {
            align-self: flex-start;
            background-color: #e9ecef;
            color: black;
        }

        .thinking-message {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #555;
            font-style: italic;
        }

        #input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
            background-color: #fafafa;
        }

        #user-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        #send-btn {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 4px;
            background-color: #28a745;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        #send-btn:hover {
            background-color: #218838;
        }

        #send-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div id="chat-container">

        <div id="chat-history">
            <div class="message nagualito-message">
                ¡Hola! Soy Nagualito, tu asistente virtual. ¿En qué puedo ayudarte?
            </div>
        </div>

        <div id="input-container">
            <input
                type="text"
                id="user-input"
                placeholder="Escribe tu mensaje..."
                aria-label="Escribe tu mensaje"
            >

            <button id="send-btn">Enviar</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const sendBtn = document.getElementById('send-btn');
            const userInput = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');

            function addMessage(text, sender) {

                const messageDiv = document.createElement('div');

                messageDiv.classList.add('message');

                if (sender === 'user') {
                    messageDiv.classList.add('user-message');
                } else if (sender === 'thinking') {
                    messageDiv.classList.add('thinking-message');
                } else {
                    messageDiv.classList.add('nagualito-message');
                }

                messageDiv.textContent = text;

                chatHistory.appendChild(messageDiv);

                chatHistory.scrollTop = chatHistory.scrollHeight;

                return messageDiv;
            }

            async function handleSend() {

                const text = userInput.value.trim();

                if (text === '') {
                    return;
                }

                // Mostrar pregunta del usuario
                addMessage(text, 'user');

                // Limpiar campo
                userInput.value = '';

                // Bloquear controles mientras responde
                sendBtn.disabled = true;
                userInput.disabled = true;

                // Mostrar indicador inmediatamente
                const thinkingMessage = addMessage(
                    'Nagualito está pensando...',
                    'thinking'
                );

                try {

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: text
                        })
                    });

                    if (!response.ok) {
                        throw new Error(
                            'El servidor respondió con estado ' + response.status
                        );
                    }

                    // Comprobar que el navegador puede leer el streaming
                    if (!response.body) {
                        throw new Error('El servidor no está enviando streaming.');
                    }

                    // Preparar lectura progresiva
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');

                    let fullResponse = '';
                    let firstChunk = true;

                    // Leer los fragmentos conforme llegan
                    while (true) {

                        const { value, done } = await reader.read();

                        if (done) {
                            break;
                        }

                        const chunk = decoder.decode(value, {
                            stream: true
                        });

                        if (chunk) {

                            // Al llegar la primera parte de la respuesta,
                            // quitar "Nagualito está pensando..."
                            if (firstChunk) {
                                thinkingMessage.remove();
                                firstChunk = false;

                                // Crear burbuja donde aparecerá la respuesta
                                addMessage('', 'nagualito');
                            }

                            fullResponse += chunk;

                            // Actualizar la última burbuja
                            const messages =
                                chatHistory.querySelectorAll('.nagualito-message');

                            const responseMessage =
                                messages[messages.length - 1];

                            responseMessage.textContent = fullResponse;

                            // Mantener visible la parte más reciente
                            chatHistory.scrollTop =
                                chatHistory.scrollHeight;
                        }
                    }

                    // Si por alguna razón no llegó ningún fragmento
                    if (firstChunk) {

                        thinkingMessage.remove();

                        addMessage(
                            'No recibí una respuesta del modelo.',
                            'nagualito'
                        );
                    }

                } catch (error) {

                    console.error(
                        'Error fetching chat response:',
                        error
                    );

                    // Quitar indicador
                    thinkingMessage.remove();

                    addMessage(
                        'Lo siento, hubo un error al conectar con el servidor.',
                        'nagualito'
                    );

                } finally {

                    // Reactivar controles
                    sendBtn.disabled = false;
                    userInput.disabled = false;
                    userInput.focus();
                }
            }

            // Botón Enviar
            sendBtn.addEventListener('click', handleSend);

            // Tecla Enter
            userInput.addEventListener('keypress', (e) => {

                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSend();
                }

            });

        });
    </script>

</body>
</html>
